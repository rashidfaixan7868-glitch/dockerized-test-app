services:

  app:
    image: mysql-test:1.0
    ports: 
    - 3000:3000
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: qwerty
      MYSQL_DB: testdb

    depends_on:
      - mysql
      
  mysql:
    image: mysql:8

    ports:
    - 3306:3306

    environment:
      MYSQL_ROOT_PASSWORD: qwerty
      MYSQL_DATABASE: testdb
    
  phpmyadmin:
    image: phpmyadmin

    ports:
    - 8080:80

    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: qwerty


